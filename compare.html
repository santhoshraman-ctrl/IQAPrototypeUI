<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Compare documents · IQA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/compare.css">
</head>
<body>
<!-- ============ App bar (same as index.html) ============ -->
<header class="appbar">
  <div class="appbar-in">
    <div class="brand">
      <img class="brand-logo" src="assets/iqa-logo.png" alt="dentsu iQA logo">
      IQA Programmatic display
    </div>
    <div class="spacer"></div>
    <div class="user">
      <button class="user-btn" type="button" id="user-btn" aria-haspopup="menu" aria-expanded="false">
        <span class="avatar" id="avatar"></span>
        <span class="user-name" id="user-name"></span>
      </button>
      <div class="menu" id="user-menu" role="menu" hidden>
        <div class="who" id="menu-who"></div>
        <button role="menuitem" type="button" id="signout">Sign out</button>
      </div>
    </div>
  </div>
</header>

<main class="cmp">
  <a class="cmp-back" href="index.html?resume=1">← Back to documents</a>

  <div class="cmp-head">
    <div>
      <h1>Compare documents</h1>
      <p class="cmp-sub" id="cmp-sub">Loading…</p>
    </div>
  </div>

  <!-- Loading / error -->
  <div class="cmp-state" id="cmp-loading" role="status">
    <span class="cmp-spinner" aria-hidden="true"></span> Comparing documents…
  </div>
  <div class="cmp-state cmp-error" id="cmp-error" role="alert" hidden>
    <span id="cmp-error-text">Something went wrong.</span>
    <button class="btn btn-ghost btn-sm" type="button" id="cmp-retry">Try again</button>
  </div>

  <div id="cmp-body" hidden>
    <!-- Summary tiles -->
    <section class="cmp-tiles" id="cmp-tiles" aria-label="Comparison summary"></section>

    <!-- Toolbar: sheet tabs + filter -->
    <div class="cmp-toolbar">
      <div class="cmp-tabs" id="cmp-tabs" role="tablist" aria-label="Sheets"></div>
      <label class="cmp-check">
        <input type="checkbox" id="cmp-diff-only">
        <span>Differences only</span>
      </label>
    </div>
    <p class="cmp-count" id="cmp-count" aria-live="polite"></p>

    <div class="cmp-layout">
      <section class="cmp-tablewrap panel" aria-label="Comparison table">
        <div class="cmp-scroll">
          <table class="cmp-table" id="cmp-table"></table>
        </div>
      </section>

      <aside class="cmp-detail panel" id="cmp-detail" aria-label="Row details" aria-live="polite">
        <p class="cmp-empty">Select a row to see what differs and why it matters.</p>
      </aside>
    </div>
  </div>
</main>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/compare.js"></script>
</body>
</html>
